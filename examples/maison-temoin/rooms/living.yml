# rooms/living.yml — one file holds one thing: the living room. Its roles
# (what the things are FOR here), its looks by role (no entity id anywhere),
# what "on" means per period and daylight. The walk fills the roles.
id: living
label: Salon
aliases: [salon, "le salon"]
roles:
  # `places:` names what a prefix of the layout IS: those are real light groups
  # (light.living_main_front) and each is a page of its own on the dashboard
  main:
    label: Plafond
    layout: [front_left, front_center, front_right, back_left, back_center, back_right]
    places: { front: Devant, back: Derrière }
  lamp:      { label: Lampadaire }
  strip:     { label: Ruban }          # nothing fills it yet: what names it renders nothing
  screen:    {}
  speaker:   {}
  satellite: {}
scenes:
  day:     { main: on, lamp: off }
  # an existing look FOLLOWING the palette for one part (0.21) and refusing its
  # life (0.22): the lamp takes the palette's white, nothing flickers here
  evening:
    palette: today
    life: false
    main: { brightness: 60, ct: warm }
    lamp: { ct: white, brightness: 30 }   # the palette's white: a part that follows without moving
  cinema:  { main: off, lamp: { brightness: 10, ct: warm }, strip: { color: "#200000" } }
  night:   { main: off, lamp: { brightness: 5, ct: warm } }   # a LOOK (H34): the night-light glimmer, never all-off
  # a look that names the PLACES inside a role: the role's own `layout:` words
  # (a place, or a prefix several of them share), each overriding the base the
  # look sets for everything it did not name. Still by role — no entity id.
  party:
    label: Fête
    icon: mdi:party-popper
    tags: [social, dynamic]                 # what the UI, a scenario and the AI pick a look by
    pinned: true                            # on the room's OWN page; every other look waits behind `Plus…`
    main:
      brightness: 12                        # the base every unnamed place takes
      front: { color: "#0096ff", brightness: 6 }
      back_center: off                      # the one straight above the table
    lamp: { brightness: 20, ct: warm }
    # what MOVES while this look holds — stopped the moment the room takes
    # another look, and its kill-switch is a helper you can see
    run:
      drift: { role: main, places: front, band: [190, 330], period: [80, 175], step: 2.5 }
  # a look that READS THE PALETTE (0.21): its numbers come from
  # sensor.house_palette at recall — `band` spreads the front row along the
  # day's arc (candidates: the day picks how many roam), `accent` is the one
  # lamp, `ct: white` the palette's white; every brightness goes through the
  # palette's level curve and the bulb's scatter of the day
  today:
    label: Palette du jour
    icon: mdi:palette
    palette: today
    main:
      front: { color: band, brightness: 40 }
      back_center: { color: band, brightness: 30 }
    lamp: { ct: white, brightness: 50 }
# daylight-first (H34): the sun drives; night forces the glimmer look
defaults: { dark: evening, dim: day, bright: day, night: night }
# the things that pick a look (0.18, pack when): the TV coming on takes the
# room to cinema; the TV going off gives the look before back
# the hands (0.19): the room's STYRBAR, bound to the room — the brain completes
# on/off with the look of the hour and drives the arrows
hands:
  living_remote: { behaviour: room_remote }
when:
  - { thing: living_tv, is: on,  look: cinema }
  - { thing: living_tv, is: off, look: before }
# THE PLAN (0.13): the room's inside corners in the house's frame (home.yml
# plan.size, centimetres), its doors and windows ON that outline, and where each
# role hangs - one point per PLACE for a role with a layout (the layout's own
# words), one point otherwise. A role with no point is not drawn (a hint).
plan:
  outline: [[20, 20], [420, 20], [420, 320], [20, 320]]
  doors:
    - { at: [420, 250], width: 80, to: hall }
  windows:
    - { at: [20, 170], width: 160 }
  at:
    main:
      front_left: [120, 90]
      front_center: [220, 90]
      front_right: [320, 90]
      back_left: [120, 240]
      back_center: [220, 240]
      back_right: [320, 240]
    lamp: [390, 290]
    screen: [220, 30]
    speaker: [300, 30]
    satellite: [40, 300]
