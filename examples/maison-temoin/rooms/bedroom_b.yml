# scene renders no script and check says so (a hint); its default sensor exists
id: bedroom_b
roles: { lamp: {} }
scenes:
  soft: { lamp: { brightness: 30, ct: warm } }
defaults: { dark: soft, dim: soft, bright: soft }   # daylight-first (H34): the sun drives, no period override
