# La maison témoin — the witness house: two floors, five rooms, one thing of
# every kind, two people, the product's pack and one of the house's own. It is
# rendered and validated on every commit; it is the documentation and the
# smoke test at once. Nothing here is anybody's: the addresses are the RFC
# documentation reserves, the names are made up.
schema: 1
house:
  name: maison_temoin
  label: Maison témoin
  lang: fr
  timezone: Europe/Paris
  url: https://home.example.com
  country: FR
  # the house's SKIN (0.11). `use:` picks a theme the PRODUCT carries — the
  # library holds the design, the house holds its deviations, and the palettes
  # merge KEY BY KEY, so repainting one colour keeps every other. `regie check`
  # prints what is on the shelf. Without `use:` a house declares the whole skin
  # itself, which is still supported and still validated the same way.
  theme:
    use: nuit
    name: temoin                 # what Home Assistant calls it (default: the library's name)
    dark: { lit: "#f0a92a" }     # this house's own filament; everything else is Nuit's
profile: ct
packs: [modes, signals, scenes, fx, notify, scenarios, lighting, when, hands, matter, palette, chalet]
# the family's controls (W3b): the settings view, the phones driving
# home/away (behind a visible kill-switch), lights back from power taking
# the default look; the ne-répond-plus alerts stay on here
controls: { panel: true, presence: true, restore_default: true, palette: true }
paths:
  house_packs: packs
# one file holds one thing (0.4): the rooms' looks, the modes, the effects and
# the stories live beside this file and are merged in before validation
include:
  plan: plan.yml
  rooms: rooms/*.yml
  modes: modes.yml
  fx: fx.yml
  scenarios: scenarios/*.yml
# the brain's own owner: the break-glass login, created by `regie apply` at
# the first boot (its password is the secret owner_password)
owner: { username: gardien, label: Gardien }
# Home Assistant's own backup, scheduled by `regie apply` (encrypted with backup_password)
backup: { time: "04:00", copies: 7 }
# long-lived tokens the house's machines need (minted once, kept root-only on the brain)
tokens: [scraper]
proxy:
  trusted: [192.0.2.2]
oidc:
  client_id: home
  discovery_url: https://auth.example.com/application/o/home/.well-known/openid-configuration
  display_name: Maison témoin
  roles: { admin: admins, user: household }
zigbee:
  channel: 25
  coordinators:
    - { id: main, thing: coordinator_main, port: 6638, adapter: zstack }
# the same box's other radio (home.md 4.3): the border router the brain is
# pointed at. The DATASET is never here - the fleet mints it and pushes it;
# the engine only introduces a router that is already holding this network.
thread:
  network_name: maison-temoin
  channel: 15
  border_routers:
    - { id: main, thing: coordinator_main, port: 8080 }
mqtt:
  host: 192.0.2.5
# THE PLAN (0.13): the frame every room draws itself in - the flat's outer
# envelope in centimetres - and a drawing to lay under the walls (a file
# beside this one, copied into the brain's www/). The rooms say the rest
# (rooms/<id>.yml: plan:). Nothing appears on the Plan tab that a file did not
# place: a thing whose role has no point is not drawn, and check says so.
# (the plan's own file since 0.15 - the frame, the drawing and the walls as
# drawn: include.plan below)
floors:
  - { id: ground, label: Rez-de-chaussée, level: 0 }
  - { id: upstairs, label: Étage, level: 1 }
areas:
  - { id: hall, label: Entrée, floor: ground }
  - { id: living, label: Salon, floor: ground }
  - { id: kitchen, label: Cuisine, floor: ground }
  - { id: bedroom_a, label: Chambre A, floor: upstairs }
  - { id: bedroom_b, label: Chambre B, floor: upstairs }
  # a PARKING room (0.10): what has no room yet. Its own file says so.
  - { id: spare, label: Le carton }
people:
  - { id: alice, label: Alice, admin: true, phone: alice_pixel }   # the companion app's slug: notify.alice, notify.household
  - { id: bob, label: Bob }
things:
  # the radio itself is a thing: it has an address, a reservation, a check
  - { id: coordinator_main, area: living, kind: coordinator, via: lan, vendor: SMLIGHT, model: SLZB-MR1U, host: 192.0.2.10, mac: "00:00:5e:00:53:10" }
  # the living room — Zigbee lights, a remote bound to the room, the screen things
  # `role` (0.4) = what a thing is FOR in its room — the key scenes and effects
  # are written on; `at` = its place in the role's layout (rooms/living.yml)
  - { id: living_ceiling, area: living, kind: light, via: zigbee, vendor: IKEA, model: LED1836G9, ieee: "0x000d6ffffe000001", role: main, at: front_left, options: { dim: true } }
  - { id: living_ceiling_2, area: living, kind: light, via: zigbee, vendor: IKEA, model: LED1836G9, ieee: "0x000d6ffffe000005", role: main, at: front_right }
  - { id: living_ceiling_3, area: living, kind: light, via: zigbee, vendor: IKEA, model: LED1836G9, ieee: "0x000d6ffffe000006", role: main, at: back_center }
  - { id: living_floor_lamp, area: living, kind: light, via: zigbee, label: Lampadaire, ieee: "0x000d6ffffe000002", role: lamp }
  - { id: living_remote, area: living, kind: remote, via: zigbee, vendor: IKEA, model: E2001, ieee: "0x000d6ffffe000003", bind: [living] }
  - { id: living_thermostat, area: living, kind: thermostat, via: zigbee, ieee: "0x000d6ffffe000004" }
  - { id: living_tv, area: living, kind: tv, via: wifi, integration: [androidtv_remote, cast], host: 192.0.2.20, mac: "00:00:5e:00:53:20", role: screen }
  - { id: living_cast, area: living, kind: cast, via: wifi, integration: cast, mac: "00:00:5e:00:53:21" }
  - { id: living_speaker, area: living, kind: speaker, via: wifi, integration: sonos, mac: "00:00:5e:00:53:22", role: speaker }
  - { id: living_satellite, area: living, kind: satellite, via: wifi, integration: wyoming, host: 192.0.2.23, role: satellite }
  # a Matter bulb over Wi-Fi (pack matter): commissioned by the phone, adopted by
  # `pair --matter` — keyed on its serial, roomed and named by apply, its
  # address a reservation like any network thing's
  - { id: living_bulb, area: living, kind: light, via: matter, vendor: Example, model: "Bulb A19", serial: "EX-000001", mac: "00:00:5e:00:53:41" }
  # the hall — a room that senses (its dark_below is in rooms/hall.yml), the door, the lock, a camera
  - { id: hall_ceiling, area: hall, kind: light, via: zigbee, ieee: "0x000d6ffffe000010", role: main }
  - { id: hall_motion, area: hall, kind: motion, via: zigbee, ieee: "0x000d6ffffe000011", role: motion, options: { off_after: "00:03:00" } }
  - { id: hall_door, area: hall, kind: door, via: zigbee, ieee: "0x000d6ffffe000012", role: door }
  - { id: hall_lock, area: hall, kind: lock, via: zigbee, ieee: "0x000d6ffffe000013" }
  - { id: hall_camera, area: hall, kind: camera, via: wifi, integration: generic, host: 192.0.2.30 }
  # the kitchen — a Wi-Fi plug, a sensor, a valve, the printer, a thing that PUSHES over MQTT
  - { id: kitchen_ceiling, area: kitchen, kind: light, via: zigbee, ieee: "0x000d6ffffe000020" }
  # the carton: a bulb nobody has screwed in and a remote nobody has bound.
  # No `role` — a thing with a role has a place, and check says so.
  - { id: spare_bulb, area: spare, kind: light, via: zigbee, vendor: IKEA, model: LED2109G6, label: "Ampoule neuve", ieee: "0x000d6ffffe0000f1" }
  - { id: spare_remote, area: spare, kind: remote, via: zigbee, vendor: IKEA, model: E2001, label: "Télécommande neuve", ieee: "0x000d6ffffe0000f2" }
  - { id: kitchen_plug, area: kitchen, kind: plug, via: wifi, label: Cafetière, integration: tplink, host: 192.0.2.31, mac: "00:00:5e:00:53:31" }
  - { id: kitchen_temperature, area: kitchen, kind: sensor, via: zigbee, ieee: "0x000d6ffffe000021" }
  - { id: kitchen_valve, area: kitchen, kind: valve, via: zigbee, ieee: "0x000d6ffffe000022" }
  - { id: kitchen_printer, area: kitchen, kind: printer, via: wifi, integration: ipp, host: 192.0.2.32 }
  - { id: kitchen_hood, area: kitchen, kind: switch, via: zigbee, label: Hotte, ieee: "0x000d6ffffe000023" }
  - { id: kitchen_energy, area: kitchen, kind: sensor, via: mqtt, label: Compteur }
  # upstairs — a wall switch bound straight to its bulb, a cover, a Bluetooth proxy
  - { id: bedroom_a_ceiling, area: bedroom_a, kind: light, via: zigbee, ieee: "0x000d6ffffe000030", role: main }
  - { id: bedroom_a_cover, area: bedroom_a, kind: cover, via: zigbee, ieee: "0x000d6ffffe000031" }
  - { id: bedroom_a_wall, area: bedroom_a, kind: remote, via: zigbee, ieee: "0x000d6ffffe000032", bind: [bedroom_a_ceiling] }
  - { id: bedroom_b_ceiling, area: bedroom_b, kind: light, via: zigbee, ieee: "0x000d6ffffe000040" }
  - { id: bedroom_b_proxy, area: bedroom_b, kind: proxy, via: esphome, host: 192.0.2.40 }
  # a thing the walk has not reached yet: no address, so it renders nowhere and check says so
  # (and no role yet: bedroom B's scenes wait — a hint, never an error)
  - { id: bedroom_b_lamp, area: bedroom_b, kind: light, via: zigbee }
