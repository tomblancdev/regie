# Pack `fx` — effects: a transient, parameterised, self-restoring behaviour on
# a target. shapes/ are THE BRICKS (what, never how: steps of level, colour,
# hold, transition; repeats; bricks composed with `use:`); backends/ are THE
# COMPILERS (how; each declares its ENVELOPE — the finest step it honours,
# what it cannot do). The engine (src/regie/fx.py) flattens a shape, clamps
# every hold to the backend's step and says so, and renders one script per
# enabled shape: script.fx_<shape> with `target` + the shape's fields;
# snapshot → run → restore. 0.4 compiles for `ha` only — the generic
# light-service loop, the slowest rung; the per-protocol folders carry their
# envelope, written down, measured at their bench.
name: fx
summary: script.fx_<shape> per shape — flash · fade · pulse · blackout · strike, compiled for the ha backend
kinds: []
services: []
templates:
  - { src: packages/fx.yaml.j2, dst: home-assistant/packages/fx.yaml }
cards: []
