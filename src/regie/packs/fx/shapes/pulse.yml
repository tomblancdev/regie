# pulse — up and down, a few times; `over` is each half's time.
summary: breathe between two levels
icon: mdi:pulse
tags: { kind: light, mood: alive }
fields: { high: 100, low: 20, over: 1, times: 3, colour: null }
steps:
  - { level: $high, colour: $colour, transition: $over, hold: $over }
  - { level: $low, colour: $colour, transition: $over, hold: $over }
repeat: $times
