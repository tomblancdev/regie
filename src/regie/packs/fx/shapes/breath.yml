# breath — quelque chose respire dans la pièce. Pas `pulse` : une poitrine n'est
# pas une sinusoïde. L'inspiration est rapide, l'expiration est longue, et LA
# PAUSE en bas est ce qui transforme une lampe qui baisse en un corps — on se
# met à attendre la suivante, et l'attente est l'effet. Luminosité seule, donc
# elle tourne sur les bougies sans couleur ; et c'est l'une des rares formes
# qu'une Govee fait BIEN, puisqu'elle lisse chaque transition — ce qui ruine un
# stroboscope et convient exactement ici.
summary: a slow asymmetric breath — quick in, long out, a pause at the bottom
icon: mdi:weather-windy
tags: { kind: light, mood: dread }
needs: { step: 0.8 }
fields: { high: 45, low: 8, times: 6 }
steps:
  - { level: $high, transition: 1.1, hold: 1.3 }
  - { level: $low,  transition: 2.6, hold: 2.8 }
  - { level: $low,  hold: [0.8, 2.2] }
repeat: $times
