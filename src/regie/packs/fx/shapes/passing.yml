# passing — quelque chose est passé entre vous et la lampe. Ce n'est PAS un
# scintillement : un scintillement est électrique et déchiqueté, une ombre est
# douce, à sens unique, et finie avant qu'on en soit sûr. Ce doute EST l'effet,
# et c'est pourquoi elle tourne une fois et n'a pas de `repeat:` — deux fois est
# une panne, trois fois est une blague. À poser sur un capteur de mouvement dans
# une pièce où personne n'est, ou à tirer depuis le téléphone pendant que
# quelqu'un d'autre est dans le couloir.
