# Profile `ct` — a Debian-like host with podman + systemd: an LXC container,
# a VM, a mini-PC. Quadlet units on host networking; the brain's tree under
# one root. The engine assumes nothing else about the host: no lane, no
# gateway, no log shipper, no backup server — those are the house's, outside.
name: ct
summary: a Debian-like host with podman + systemd — Quadlet units, host networking, one root
runtime: quadlet
network: host
root: /srv/home
units_dir: /etc/containers/systemd

# what this release of the product was tested against (a house may pin its
# own under `pins:` — `doctor` will say it did)
pins:
  home_assistant: "2026.8.3"
  mosquitto: "2.0.22"
  zigbee2mqtt: "2.13.0"
images:
  home_assistant: ghcr.io/home-assistant/home-assistant
  mosquitto: docker.io/library/eclipse-mosquitto
  zigbee2mqtt: docker.io/koenkk/zigbee2mqtt
# the uid an image drops to: a rendered file it must read (base.yml `owner`)
# is chowned to it when the engine runs as root - the broker's image refuses
# a root-only password file on its read-only config mount
users:
  mosquitto: 1883

# the units — the half that differs between profiles (a `docker` profile
# renders a compose file here instead)
templates:
  - { src: units/home-assistant.container.j2, dst: units/home-assistant.container }
  - { src: units/mosquitto.container.j2, dst: units/mosquitto.container }
  - { src: units/zigbee2mqtt.container.j2, dst: "units/zigbee2mqtt-{{ coordinator.id }}.container", each: coordinators }
