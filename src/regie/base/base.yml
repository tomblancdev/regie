# The config tree every profile renders — the same brain whatever the host.
# `each` renders one file per item (coordinators | areas); `mode` is for the
# files that hold a secret; `owner` names the profile's user (an image's uid)
# that must read the file - chowned when the engine runs as root.
#
# automations.yaml / scenes.yaml / scripts.yaml are the files Home Assistant's
# UI editor writes into. They are rendered EMPTY at every render: an
# automation is a package (a file from home.yml or a pack), which the UI shows
# read-only by Home Assistant's own rule; a draft saved in the UI works until
# the next render, then it is gone. The rule with no exception, and no button
# to remove.
templates:
  - { src: home-assistant/configuration.yaml.j2, dst: home-assistant/configuration.yaml }
  - { src: home-assistant/automations.yaml.j2, dst: home-assistant/automations.yaml }
  - { src: home-assistant/scenes.yaml.j2, dst: home-assistant/scenes.yaml }
  - { src: home-assistant/scripts.yaml.j2, dst: home-assistant/scripts.yaml }
  - { src: home-assistant/secrets.yaml.j2, dst: home-assistant/secrets.yaml, mode: "0600" }
  - { src: home-assistant/dashboards/phone.yaml.j2, dst: home-assistant/dashboards/phone.yaml }
  # the skin (0.10): the theme file, and the typefaces as one ES module the
  # frontend loads on every page — both only when the house names a theme
  - { src: home-assistant/themes/theme.yaml.j2, dst: "home-assistant/themes/{{ theme_name }}.yaml", when: theme }
  - { src: home-assistant/www/regie-skin.js.j2, dst: home-assistant/www/regie-skin.js, when: theme }
  # the plan (0.13): the card the tab is drawn with, carried by the product
  # (base/www/VENDOR.md), and the house's own drawing under the walls - both
  # copied as they are, only when the house declares a plan
  - { copy: www/easy-floorplan-card.js, dst: home-assistant/www/easy-floorplan-card.js, when: plan }
  # L'Atelier des palettes (0.25): the product's own card, a window on the
  # palettes' helpers — a Lovelace resource, like the plan's card
  - { copy: www/regie-atelier.js, dst: home-assistant/www/regie-atelier.js, when: "pack:palette" }
  - { house_file: plan.image, dst: "home-assistant/www/{{ plan_image }}", when: plan_image }
  - { src: mosquitto/mosquitto.conf.j2, dst: mosquitto/config/mosquitto.conf, owner: mosquitto }
  - { src: mosquitto/acl.j2, dst: mosquitto/config/acl, owner: mosquitto }
  - { src: mosquitto/passwd.j2, dst: mosquitto/config/passwd, mode: "0600", owner: mosquitto }
  - { src: zigbee2mqtt/configuration.yaml.j2, dst: "zigbee2mqtt/{{ coordinator.id }}/configuration.yaml", each: coordinators }
  - { src: zigbee2mqtt/devices.yaml.j2, dst: "zigbee2mqtt/{{ coordinator.id }}/devices.yaml", each: coordinators }
  - { src: zigbee2mqtt/groups.yaml.j2, dst: "zigbee2mqtt/{{ coordinator.id }}/groups.yaml", each: coordinators }
  - { src: zigbee2mqtt/secret.yaml.j2, dst: "zigbee2mqtt/{{ coordinator.id }}/secret.yaml", each: coordinators, mode: "0600" }

# What `default_config:` loads (Home Assistant 2026.8.3 - the default_config
# manifest's dependencies, read at the source). A house that keeps `my`
# (house.my: true, the default) renders the one line `default_config:`; a
# house that wants ITS OWN DOOR as the OAuth callback (house.my: false)
# cannot: Home Assistant's oauth2 helper redirects every consent through
# my.home-assistant.io whenever `my` is loaded, and default_config has no
# "minus one" - so the list is rendered explicitly, without `my`. Every
# member below accepts an empty `<domain>:` (read at the source: each is an
# empty_config_schema or takes an empty mapping). Check at each HA bump.
default_config:
  - assist_pipeline
  - bluetooth
  - cloud
  - conversation
  - dhcp
  - energy
  - file
  - go2rtc
  - history
  - homeassistant_alerts
  - logbook
  - media_source
  - mobile_app
  - my
  - ssdp
  - stream
  - sun
  - usage_prediction
  - usb
  - webhook
  - zeroconf

# Custom components the brain needs, pinned by tag AND digest: `regie up`
# fetches one when the house asks for it (the OIDC door -> auth_oidc) and
# lays it under home-assistant/custom_components/<domain>. A bump here is a
# release of the product; a house never edits this.
components:
  auth_oidc:
    when: oidc                       # the home.yml block that asks for it
    version: v1.2.1
    url: "https://github.com/christiaangoossens/hass-oidc-auth/releases/download/{version}/hass-oidc-auth.zip"
    sha256: e5badaaacaa63cfd6fe733924a05e76d75058836190398598fb24de57cd47ccd
