# fx_breath — rendered by La Régie: `regie share <home.yml> fx breath`.
# The shape itself is packs/fx/shapes/breath.yml in github.com/tomblancdev/regie;
# a tag whose blueprints differ from what its shapes render is refused by CI.
blueprint:
  name: fx — breath
  description: |-
    a slow asymmetric breath — quick in, long out, a pause at the bottom

    One effect of **La Régie**'s `fx` pack, travelling alone: a script built out of Home Assistant's own light and scene services. No helper, no custom code, nothing else to install.

    Create the script from this blueprint, then call it with the lights you want it on: it snapshots them, runs, and puts the snapshot back as it was.

    Fields: `target` · `high` · `low` · `times` · `restore`.
  domain: script
  homeassistant:
    min_version: 2024.8.0
  input: {}
alias: fx — breath
description: 'a slow asymmetric breath — quick in, long out, a pause at the bottom (La Régie, pack fx: a shape compiled for the ha backend)'
icon: mdi:weather-windy
mode: parallel
max: 10
fields:
  target:
    name: target
    description: 'the light or the group (a room''s role: light.<room>_<role>)'
    required: true
    selector:
      entity:
        domain: light
        multiple: true
  high:
    name: high
    selector:
      number:
        min: 0
        max: 3600
        step: 0.01
        mode: box
    default: 45
  low:
    name: low
    selector:
      number:
        min: 0
        max: 3600
        step: 0.01
        mode: box
    default: 8
  times:
    name: times
    selector:
      number:
        min: 0
        max: 3600
        step: 0.01
        mode: box
    default: 6
  restore:
    name: restore
    description: put the target back as it was, after
    default: true
    selector:
      boolean: null
variables:
  high: '{{ high | default(45) }}'
  low: '{{ low | default(8) }}'
  times: '{{ times | default(6) }}'
  snapshot: fx_{{ this.entity_id[7:] }}_{{ now().strftime('%Y%m%d%H%M%S%f') }}
  restore: '{{ restore | default(True) }}'
sequence:
- action: scene.create
  data:
    scene_id: '{{ snapshot }}'
    snapshot_entities: '{{ target }}'
- repeat:
    count: '{{ times }}'
    sequence:
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{{ {''brightness_pct'': high, ''transition'': 1.1} }}'
    - delay: 1.3
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{{ {''brightness_pct'': low, ''transition'': 2.6} }}'
    - delay: 2.8
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{{ {''brightness_pct'': low, ''transition'': 0} }}'
    - delay: '{{ [((range(800, 2201) | random) / 1000), 0.05] | max }}'
- if:
  - condition: template
    value_template: '{{ restore }}'
  then:
  - action: scene.turn_on
    target:
      entity_id: scene.{{ snapshot }}
- action: scene.delete
  target:
    entity_id: scene.{{ snapshot }}
