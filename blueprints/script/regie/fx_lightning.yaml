# fx_lightning — rendered by La Régie: `regie share <home.yml> fx lightning`.
# The shape itself is packs/fx/shapes/lightning.yml in github.com/tomblancdev/regie;
# a tag whose blueprints differ from what its shapes render is refused by CI.
blueprint:
  name: fx — lightning
  description: |-
    a storm — far flashes, two strikes, the room between them

    One effect of **La Régie**'s `fx` pack, travelling alone: a script built out of Home Assistant's own light and scene services. No helper, no custom code, nothing else to install.

    Create the script from this blueprint, then call it with the lights you want it on: it snapshots them, runs, and puts the snapshot back as it was.

    Fields: `target` · `colour` · `passes` · `restore`.

    Compiled for the generic light-service loop, whose finest step is 0.05 s:
    - lightning: asks 0.04 s steps, ha gives 0.05
    - lightning/strike: holds down to 0.04 s asked, the backend gives 0.05 → the low end stretched
    - lightning/strike/flash: holds down to 0.04 s asked, the backend gives 0.05 → the low end stretched
  domain: script
  homeassistant:
    min_version: 2024.8.0
  input: {}
alias: fx — lightning
description: 'a storm — far flashes, two strikes, the room between them (La Régie, pack fx: a shape compiled for the ha backend)'
icon: mdi:weather-lightning-rainy
mode: parallel
max: 10
fields:
  target:
    name: target
    description: 'the light or the group (a room''s role: light.<room>_<role>)'
    required: true
    selector:
      entity:
        domain: light
        multiple: true
  colour:
    name: colour
    description: '#rrggbb — the target''s own colour when empty'
    selector:
      text: null
    default: '#cfe0ff'
  passes:
    name: passes
    selector:
      number:
        min: 0
        max: 3600
        step: 0.01
        mode: box
    default: 1
  restore:
    name: restore
    description: put the target back as it was, after
    default: true
    selector:
      boolean: null
variables:
  colour: '{{ colour | default(''#cfe0ff'') }}'
  passes: '{{ passes | default(1) }}'
  snapshot: fx_{{ this.entity_id[7:] }}_{{ now().strftime('%Y%m%d%H%M%S%f') }}
  colour_rgb: '{{ [colour[1:3] | int(base=16), colour[3:5] | int(base=16), colour[5:7] | int(base=16)] if colour else none }}'
  restore: '{{ restore | default(True) }}'
sequence:
- action: scene.create
  data:
    scene_id: '{{ snapshot }}'
    snapshot_entities: '{{ target }}'
- repeat:
    count: '{{ passes }}'
    sequence:
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{% set d = {''brightness_pct'': (range(45, 71) | random), ''transition'': 0.08} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
    - delay: '{{ [((range(150, 301) | random) / 1000), 0.05] | max }}'
    - action: scene.turn_on
      target:
        entity_id: scene.{{ snapshot }}
      data:
        transition: 0.3
    - delay: '{{ [((range(1200, 2801) | random) / 1000), 0.05] | max }}'
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{% set d = {''brightness_pct'': (range(55, 81) | random), ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
    - delay: '{{ [((range(50, 91) | random) / 1000), 0.05] | max }}'
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{% set d = {''brightness_pct'': 0, ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
    - delay: '{{ [((range(40, 91) | random) / 1000), 0.05] | max }}'
    - repeat:
        count: '{{ (range(1, 4) | random) }}'
        sequence:
        - action: light.turn_on
          target:
            entity_id: '{{ target }}'
          data: '{% set d = {''brightness_pct'': (range(20, 51) | random), ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
        - delay: '{{ [((range(40, 81) | random) / 1000), 0.05] | max }}'
        - action: light.turn_on
          target:
            entity_id: '{{ target }}'
          data: '{% set d = {''brightness_pct'': 0, ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
        - delay: '{{ [((range(40, 81) | random) / 1000), 0.05] | max }}'
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{% set d = {''brightness_pct'': (range(70, 101) | random), ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
    - delay: '{{ [((range(80, 141) | random) / 1000), 0.05] | max }}'
    - action: scene.turn_on
      target:
        entity_id: scene.{{ snapshot }}
      data:
        transition: 0.5
    - delay: 0.5
    - delay: '{{ [((range(800, 2201) | random) / 1000), 0.05] | max }}'
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{% set d = {''brightness_pct'': (range(50, 76) | random), ''transition'': 0.08} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
    - delay: '{{ [((range(150, 301) | random) / 1000), 0.05] | max }}'
    - action: scene.turn_on
      target:
        entity_id: scene.{{ snapshot }}
      data:
        transition: 0.25
    - delay: '{{ [((range(600, 1601) | random) / 1000), 0.05] | max }}'
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{% set d = {''brightness_pct'': 100, ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
    - delay: '{{ [((range(50, 91) | random) / 1000), 0.05] | max }}'
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{% set d = {''brightness_pct'': 0, ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
    - delay: '{{ [((range(40, 91) | random) / 1000), 0.05] | max }}'
    - repeat:
        count: '{{ (range(1, 4) | random) }}'
        sequence:
        - action: light.turn_on
          target:
            entity_id: '{{ target }}'
          data: '{% set d = {''brightness_pct'': (range(20, 51) | random), ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
        - delay: '{{ [((range(40, 81) | random) / 1000), 0.05] | max }}'
        - action: light.turn_on
          target:
            entity_id: '{{ target }}'
          data: '{% set d = {''brightness_pct'': 0, ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
        - delay: '{{ [((range(40, 81) | random) / 1000), 0.05] | max }}'
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{% set d = {''brightness_pct'': (range(70, 101) | random), ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
    - delay: '{{ [((range(80, 141) | random) / 1000), 0.05] | max }}'
    - action: scene.turn_on
      target:
        entity_id: scene.{{ snapshot }}
      data:
        transition: 0.8
    - delay: 0.8
    - delay: '{{ [((range(1500, 3001) | random) / 1000), 0.05] | max }}'
- if:
  - condition: template
    value_template: '{{ restore }}'
  then:
  - action: scene.turn_on
    target:
      entity_id: scene.{{ snapshot }}
- action: scene.delete
  target:
    entity_id: scene.{{ snapshot }}
