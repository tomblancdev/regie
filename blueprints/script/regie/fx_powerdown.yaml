# fx_powerdown — rendered by La Régie: `regie share <home.yml> fx powerdown`.
# The shape itself is packs/fx/shapes/powerdown.yml in github.com/tomblancdev/regie;
# a tag whose blueprints differ from what its shapes render is refused by CI.
blueprint:
  name: fx — powerdown
  description: |-
    a machine dying in stages — drop, settle, drop, a coal, out

    One effect of **La Régie**'s `fx` pack, travelling alone: a script built out of Home Assistant's own light and scene services. No helper, no custom code, nothing else to install.

    Create the script from this blueprint, then call it with the lights you want it on: it snapshots them, runs, and puts the snapshot back as it was.

    Fields: `target` · `level` · `restore`.
  domain: script
  homeassistant:
    min_version: 2024.8.0
  input: {}
alias: fx — powerdown
description: 'a machine dying in stages — drop, settle, drop, a coal, out (La Régie, pack fx: a shape compiled for the ha backend)'
icon: mdi:power-plug-off
mode: parallel
max: 10
fields:
  target:
    name: target
    description: 'the light or the group (a room''s role: light.<room>_<role>)'
    required: true
    selector:
      entity:
        domain: light
        multiple: true
  level:
    name: level
    selector:
      number:
        min: 0
        max: 100
        step: 0.01
        mode: box
    default: 100
  restore:
    name: restore
    description: put the target back as it was, after
    default: false
    selector:
      boolean: null
variables:
  level: '{{ level | default(100) }}'
  snapshot: fx_{{ this.entity_id[7:] }}_{{ now().strftime('%Y%m%d%H%M%S%f') }}
  restore: '{{ restore | default(False) }}'
sequence:
- action: scene.create
  data:
    scene_id: '{{ snapshot }}'
    snapshot_entities: '{{ target }}'
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{{ dict({''brightness_pct'': level, ''transition'': 0}, rgb_color=[232, 244, 255]) }}'
- delay: '{{ [((range(600, 1401) | random) / 1000), 0.05] | max }}'
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{{ dict({''brightness_pct'': 54, ''transition'': 0}, rgb_color=[219, 233, 255]) }}'
- delay: '{{ [((range(500, 1201) | random) / 1000), 0.05] | max }}'
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{{ {''brightness_pct'': 50, ''transition'': 0} }}'
- delay: '{{ [((range(300, 901) | random) / 1000), 0.05] | max }}'
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{{ dict({''brightness_pct'': 24, ''transition'': 0}, rgb_color=[255, 208, 160]) }}'
- delay: '{{ [((range(400, 1101) | random) / 1000), 0.05] | max }}'
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{{ {''brightness_pct'': 27, ''transition'': 0} }}'
- delay: '{{ [((range(200, 601) | random) / 1000), 0.05] | max }}'
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{{ dict({''brightness_pct'': 9, ''transition'': 0}, rgb_color=[255, 106, 26]) }}'
- delay: '{{ [((range(500, 1501) | random) / 1000), 0.05] | max }}'
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{{ dict({''brightness_pct'': 5, ''transition'': 0}, rgb_color=[140, 26, 0]) }}'
- delay: 2.5
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{{ {''brightness_pct'': 2, ''transition'': 3} }}'
- delay: 3.2
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{{ {''brightness_pct'': 0, ''transition'': 0} }}'
- delay: 0.4
- if:
  - condition: template
    value_template: '{{ restore }}'
  then:
  - action: scene.turn_on
    target:
      entity_id: scene.{{ snapshot }}
- action: scene.delete
  target:
    entity_id: scene.{{ snapshot }}
