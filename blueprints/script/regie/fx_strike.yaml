# fx_strike — rendered by La Régie: `regie share <home.yml> fx strike`.
# The shape itself is packs/fx/shapes/strike.yml in github.com/tomblancdev/regie;
# a tag whose blueprints differ from what its shapes render is refused by CI.
blueprint:
  name: fx — strike
  description: |-
    a lightning strike — a leader, flickers, the return stroke, then the room

    One effect of **La Régie**'s `fx` pack, travelling alone: a script built out of Home Assistant's own light and scene services. No helper, no custom code, nothing else to install.

    Create the script from this blueprint, then call it with the lights you want it on: it snapshots them, runs, and puts the snapshot back as it was.

    Fields: `target` · `colour` · `intensity` · `back` · `restore`.

    Compiled for the generic light-service loop, whose finest step is 0.05 s:
    - strike: asks 0.04 s steps, ha gives 0.05
    - strike: holds down to 0.04 s asked, the backend gives 0.05 → the low end stretched
    - strike/flash: holds down to 0.04 s asked, the backend gives 0.05 → the low end stretched
  domain: script
  homeassistant:
    min_version: 2024.8.0
  input: {}
alias: fx — strike
description: 'a lightning strike — a leader, flickers, the return stroke, then the room (La Régie, pack fx: a shape compiled for the ha backend)'
icon: mdi:weather-lightning
mode: parallel
max: 10
fields:
  target:
    name: target
    description: 'the light or the group (a room''s role: light.<room>_<role>)'
    required: true
    selector:
      entity:
        domain: light
        multiple: true
  colour:
    name: colour
    description: '#rrggbb — the target''s own colour when empty'
    selector:
      text: null
    default: '#cfe0ff'
  intensity:
    name: intensity
    selector:
      number:
        min: 0
        max: 3600
        step: 0.01
        mode: box
    default: 100
  back:
    name: back
    selector:
      number:
        min: 0
        max: 3600
        step: 0.01
        mode: box
    default: 0.4
  restore:
    name: restore
    description: put the target back as it was, after
    default: true
    selector:
      boolean: null
variables:
  colour: '{{ colour | default(''#cfe0ff'') }}'
  intensity: '{{ intensity | default(100) }}'
  back: '{{ back | default(0.4) }}'
  snapshot: fx_{{ this.entity_id[7:] }}_{{ now().strftime('%Y%m%d%H%M%S%f') }}
  colour_rgb: '{{ [colour[1:3] | int(base=16), colour[3:5] | int(base=16), colour[5:7] | int(base=16)] if colour else none }}'
  restore: '{{ restore | default(True) }}'
sequence:
- action: scene.create
  data:
    scene_id: '{{ snapshot }}'
    snapshot_entities: '{{ target }}'
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{% set d = {''brightness_pct'': intensity, ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
- delay: '{{ [((range(50, 91) | random) / 1000), 0.05] | max }}'
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{% set d = {''brightness_pct'': 0, ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
- delay: '{{ [((range(40, 91) | random) / 1000), 0.05] | max }}'
- repeat:
    count: '{{ (range(1, 4) | random) }}'
    sequence:
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{% set d = {''brightness_pct'': (range(20, 51) | random), ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
    - delay: '{{ [((range(40, 81) | random) / 1000), 0.05] | max }}'
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{% set d = {''brightness_pct'': 0, ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
    - delay: '{{ [((range(40, 81) | random) / 1000), 0.05] | max }}'
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{% set d = {''brightness_pct'': (range(70, 101) | random), ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
- delay: '{{ [((range(80, 141) | random) / 1000), 0.05] | max }}'
- action: scene.turn_on
  target:
    entity_id: scene.{{ snapshot }}
  data:
    transition: '{{ back }}'
- delay: '{{ [back | float, 0.05] | max }}'
- if:
  - condition: template
    value_template: '{{ restore }}'
  then:
  - action: scene.turn_on
    target:
      entity_id: scene.{{ snapshot }}
- action: scene.delete
  target:
    entity_id: scene.{{ snapshot }}
