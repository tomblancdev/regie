# fx_dying — rendered by La Régie: `regie share <home.yml> fx dying`.
# The shape itself is packs/fx/shapes/dying.yml in github.com/tomblancdev/regie;
# a tag whose blueprints differ from what its shapes render is refused by CI.
blueprint:
  name: fx — dying
  description: |-
    a bulb dying — brown-outs, false hope, then out for good

    One effect of **La Régie**'s `fx` pack, travelling alone: a script built out of Home Assistant's own light and scene services. No helper, no custom code, nothing else to install.

    Create the script from this blueprint, then call it with the lights you want it on: it snapshots them, runs, and puts the snapshot back as it was.

    Fields: `target` · `colour` · `level` · `restore`.

    Compiled for the generic light-service loop, whose finest step is 0.05 s:
    - dying: asks 0.02 s steps, ha gives 0.05
    - dying/flicker: holds down to 0.02 s asked, the backend gives 0.05 → the low end stretched
  domain: script
  homeassistant:
    min_version: 2024.8.0
  input: {}
alias: fx — dying
description: 'a bulb dying — brown-outs, false hope, then out for good (La Régie, pack fx: a shape compiled for the ha backend)'
icon: mdi:lightbulb-off
mode: parallel
max: 10
fields:
  target:
    name: target
    description: 'the light or the group (a room''s role: light.<room>_<role>)'
    required: true
    selector:
      entity:
        domain: light
        multiple: true
  colour:
    name: colour
    description: '#rrggbb — the target''s own colour when empty'
    selector:
      text: null
  level:
    name: level
    selector:
      number:
        min: 0
        max: 100
        step: 0.01
        mode: box
    default: 70
  restore:
    name: restore
    description: put the target back as it was, after
    default: false
    selector:
      boolean: null
variables:
  colour: '{{ colour | default(None) }}'
  level: '{{ level | default(70) }}'
  snapshot: fx_{{ this.entity_id[7:] }}_{{ now().strftime('%Y%m%d%H%M%S%f') }}
  colour_rgb: '{{ [colour[1:3] | int(base=16), colour[3:5] | int(base=16), colour[5:7] | int(base=16)] if colour else none }}'
  restore: '{{ restore | default(False) }}'
sequence:
- action: scene.create
  data:
    scene_id: '{{ snapshot }}'
    snapshot_entities: '{{ target }}'
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{% set d = {''brightness_pct'': level, ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
- delay: '{{ [((range(1000, 2001) | random) / 1000), 0.05] | max }}'
- repeat:
    count: '{{ (range(2, 5) | random) }}'
    sequence:
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{% set d = {''brightness_pct'': (range(30, 101) | random), ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
    - delay: '{{ [((range(20, 81) | random) / 1000), 0.05] | max }}'
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{% set d = {''brightness_pct'': (range(0, 21) | random), ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
    - delay: '{{ [((range(20, 151) | random) / 1000), 0.05] | max }}'
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{{ {''brightness_pct'': (range(12, 23) | random), ''transition'': 0.4} }}'
- delay: '{{ [((range(1500, 3001) | random) / 1000), 0.05] | max }}'
- repeat:
    count: '{{ (range(3, 7) | random) }}'
    sequence:
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{% set d = {''brightness_pct'': (range(30, 101) | random), ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
    - delay: '{{ [((range(20, 81) | random) / 1000), 0.05] | max }}'
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{% set d = {''brightness_pct'': (range(0, 21) | random), ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
    - delay: '{{ [((range(20, 151) | random) / 1000), 0.05] | max }}'
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{{ {''brightness_pct'': level, ''transition'': 0.6} }}'
- delay: '{{ [((range(800, 1601) | random) / 1000), 0.05] | max }}'
- repeat:
    count: '{{ (range(4, 10) | random) }}'
    sequence:
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{% set d = {''brightness_pct'': (range(30, 101) | random), ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
    - delay: '{{ [((range(20, 81) | random) / 1000), 0.05] | max }}'
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{% set d = {''brightness_pct'': (range(0, 21) | random), ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
    - delay: '{{ [((range(20, 151) | random) / 1000), 0.05] | max }}'
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{{ {''brightness_pct'': (range(6, 15) | random), ''transition'': 0.8} }}'
- delay: '{{ [((range(1000, 2001) | random) / 1000), 0.05] | max }}'
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{{ {''brightness_pct'': 0, ''transition'': 0} }}'
- delay: 0.6
- if:
  - condition: template
    value_template: '{{ restore }}'
  then:
  - action: scene.turn_on
    target:
      entity_id: scene.{{ snapshot }}
- action: scene.delete
  target:
    entity_id: scene.{{ snapshot }}
