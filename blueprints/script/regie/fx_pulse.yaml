# fx_pulse — rendered by La Régie: `regie share <home.yml> fx pulse`.
# The shape itself is packs/fx/shapes/pulse.yml in github.com/tomblancdev/regie;
# a tag whose blueprints differ from what its shapes render is refused by CI.
blueprint:
  name: fx — pulse
  description: |-
    breathe between two levels

    One effect of **La Régie**'s `fx` pack, travelling alone: a script built out of Home Assistant's own light and scene services. No helper, no custom code, nothing else to install.

    Create the script from this blueprint, then call it with the lights you want it on: it snapshots them, runs, and puts the snapshot back as it was.

    Fields: `target` · `high` · `low` · `over` · `times` · `colour` · `restore`.
  domain: script
  homeassistant:
    min_version: 2024.8.0
  input: {}
alias: fx — pulse
description: 'breathe between two levels (La Régie, pack fx: a shape compiled for the ha backend)'
icon: mdi:pulse
mode: parallel
max: 10
fields:
  target:
    name: target
    description: 'the light or the group (a room''s role: light.<room>_<role>)'
    required: true
    selector:
      entity:
        domain: light
        multiple: true
  high:
    name: high
    selector:
      number:
        min: 0
        max: 3600
        step: 0.01
        mode: box
    default: 100
  low:
    name: low
    selector:
      number:
        min: 0
        max: 3600
        step: 0.01
        mode: box
    default: 20
  over:
    name: over
    selector:
      number:
        min: 0
        max: 3600
        step: 0.01
        mode: box
    default: 1
  times:
    name: times
    selector:
      number:
        min: 0
        max: 3600
        step: 0.01
        mode: box
    default: 3
  colour:
    name: colour
    description: '#rrggbb — the target''s own colour when empty'
    selector:
      text: null
  restore:
    name: restore
    description: put the target back as it was, after
    default: true
    selector:
      boolean: null
variables:
  high: '{{ high | default(100) }}'
  low: '{{ low | default(20) }}'
  over: '{{ over | default(1) }}'
  times: '{{ times | default(3) }}'
  colour: '{{ colour | default(None) }}'
  snapshot: fx_{{ this.entity_id[7:] }}_{{ now().strftime('%Y%m%d%H%M%S%f') }}
  colour_rgb: '{{ [colour[1:3] | int(base=16), colour[3:5] | int(base=16), colour[5:7] | int(base=16)] if colour else none }}'
  restore: '{{ restore | default(True) }}'
sequence:
- action: scene.create
  data:
    scene_id: '{{ snapshot }}'
    snapshot_entities: '{{ target }}'
- repeat:
    count: '{{ times }}'
    sequence:
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{% set d = {''brightness_pct'': high, ''transition'': over} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
    - delay: '{{ [over | float, 0.05] | max }}'
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{% set d = {''brightness_pct'': low, ''transition'': over} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
    - delay: '{{ [over | float, 0.05] | max }}'
- if:
  - condition: template
    value_template: '{{ restore }}'
  then:
  - action: scene.turn_on
    target:
      entity_id: scene.{{ snapshot }}
- action: scene.delete
  target:
    entity_id: scene.{{ snapshot }}
