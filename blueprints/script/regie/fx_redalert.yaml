# fx_redalert — rendered by La Régie: `regie share <home.yml> fx redalert`.
# The shape itself is packs/fx/shapes/redalert.yml in github.com/tomblancdev/regie;
# a tag whose blueprints differ from what its shapes render is refused by CI.
blueprint:
  name: fx — redalert
  description: |-
    the ship's alarm — two hard beats, a gap, again

    One effect of **La Régie**'s `fx` pack, travelling alone: a script built out of Home Assistant's own light and scene services. No helper, no custom code, nothing else to install.

    Create the script from this blueprint, then call it with the lights you want it on: it snapshots them, runs, and puts the snapshot back as it was.

    Fields: `target` · `colour` · `level` · `times` · `restore`.
  domain: script
  homeassistant:
    min_version: 2024.8.0
  input: {}
alias: fx — redalert
description: 'the ship''s alarm — two hard beats, a gap, again (La Régie, pack fx: a shape compiled for the ha backend)'
icon: mdi:alert-octagon
mode: parallel
max: 10
fields:
  target:
    name: target
    description: 'the light or the group (a room''s role: light.<room>_<role>)'
    required: true
    selector:
      entity:
        domain: light
        multiple: true
  colour:
    name: colour
    description: '#rrggbb — the target''s own colour when empty'
    selector:
      text: null
    default: '#ff0008'
  level:
    name: level
    selector:
      number:
        min: 0
        max: 100
        step: 0.01
        mode: box
    default: 100
  times:
    name: times
    selector:
      number:
        min: 0
        max: 3600
        step: 0.01
        mode: box
    default: 6
  restore:
    name: restore
    description: put the target back as it was, after
    default: true
    selector:
      boolean: null
variables:
  colour: '{{ colour | default(''#ff0008'') }}'
  level: '{{ level | default(100) }}'
  times: '{{ times | default(6) }}'
  snapshot: fx_{{ this.entity_id[7:] }}_{{ now().strftime('%Y%m%d%H%M%S%f') }}
  colour_rgb: '{{ [colour[1:3] | int(base=16), colour[3:5] | int(base=16), colour[5:7] | int(base=16)] if colour else none }}'
  restore: '{{ restore | default(True) }}'
sequence:
- action: scene.create
  data:
    scene_id: '{{ snapshot }}'
    snapshot_entities: '{{ target }}'
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{% set d = {''brightness_pct'': 15, ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
- delay: 0.15
- repeat:
    count: '{{ times }}'
    sequence:
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{{ {''brightness_pct'': level, ''transition'': 0} }}'
    - delay: 0.2
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{{ {''brightness_pct'': 12, ''transition'': 0} }}'
    - delay: 0.15
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{{ {''brightness_pct'': level, ''transition'': 0} }}'
    - delay: 0.2
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{{ {''brightness_pct'': 12, ''transition'': 0} }}'
    - delay: 0.75
- if:
  - condition: template
    value_template: '{{ restore }}'
  then:
  - action: scene.turn_on
    target:
      entity_id: scene.{{ snapshot }}
- action: scene.delete
  target:
    entity_id: scene.{{ snapshot }}
