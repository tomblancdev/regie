# fx_dawn — rendered by La Régie: `regie share <home.yml> fx dawn`.
# The shape itself is packs/fx/shapes/dawn.yml in github.com/tomblancdev/regie;
# a tag whose blueprints differ from what its shapes render is refused by CI.
blueprint:
  name: fx — dawn
  description: |-
    a sunrise, in your own time — red to white over seven long steps

    One effect of **La Régie**'s `fx` pack, travelling alone: a script built out of Home Assistant's own light and scene services. No helper, no custom code, nothing else to install.

    Create the script from this blueprint, then call it with the lights you want it on: it snapshots them, runs, and puts the snapshot back as it was.

    Fields: `target` · `pace` · `level` · `restore`.
  domain: script
  homeassistant:
    min_version: 2024.8.0
  input: {}
alias: fx — dawn
description: 'a sunrise, in your own time — red to white over seven long steps (La Régie, pack fx: a shape compiled for the ha backend)'
icon: mdi:weather-sunset-up
mode: parallel
max: 10
fields:
  target:
    name: target
    description: 'the light or the group (a room''s role: light.<room>_<role>)'
    required: true
    selector:
      entity:
        domain: light
        multiple: true
  pace:
    name: pace
    selector:
      number:
        min: 0
        max: 3600
        step: 0.01
        mode: box
    default: 100
  level:
    name: level
    selector:
      number:
        min: 0
        max: 100
        step: 0.01
        mode: box
    default: 90
  restore:
    name: restore
    description: put the target back as it was, after
    default: false
    selector:
      boolean: null
variables:
  pace: '{{ pace | default(100) }}'
  level: '{{ level | default(90) }}'
  snapshot: fx_{{ this.entity_id[7:] }}_{{ now().strftime('%Y%m%d%H%M%S%f') }}
  restore: '{{ restore | default(False) }}'
sequence:
- action: scene.create
  data:
    scene_id: '{{ snapshot }}'
    snapshot_entities: '{{ target }}'
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{{ dict({''brightness_pct'': 1, ''transition'': 0}, rgb_color=[42, 5, 0]) }}'
- delay: 2.0
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{{ dict({''brightness_pct'': 6, ''transition'': pace}, rgb_color=[94, 20, 0]) }}'
- delay: '{{ [pace | float, 0.05] | max }}'
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{{ dict({''brightness_pct'': 18, ''transition'': pace}, rgb_color=[168, 60, 5]) }}'
- delay: '{{ [pace | float, 0.05] | max }}'
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{{ dict({''brightness_pct'': 38, ''transition'': pace}, rgb_color=[224, 118, 26]) }}'
- delay: '{{ [pace | float, 0.05] | max }}'
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{{ dict({''brightness_pct'': 62, ''transition'': pace}, rgb_color=[245, 170, 85]) }}'
- delay: '{{ [pace | float, 0.05] | max }}'
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{{ dict({''brightness_pct'': 80, ''transition'': pace}, rgb_color=[255, 215, 163]) }}'
- delay: '{{ [pace | float, 0.05] | max }}'
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{{ dict({''brightness_pct'': level, ''transition'': pace}, rgb_color=[255, 242, 224]) }}'
- delay: '{{ [pace | float, 0.05] | max }}'
- if:
  - condition: template
    value_template: '{{ restore }}'
  then:
  - action: scene.turn_on
    target:
      entity_id: scene.{{ snapshot }}
- action: scene.delete
  target:
    entity_id: scene.{{ snapshot }}
