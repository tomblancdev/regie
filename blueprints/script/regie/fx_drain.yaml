# fx_drain — rendered by La Régie: `regie share <home.yml> fx drain`.
# The shape itself is packs/fx/shapes/drain.yml in github.com/tomblancdev/regie;
# a tag whose blueprints differ from what its shapes render is refused by CI.
blueprint:
  name: fx — drain
  description: |-
    the colour bleeds out — amber, blood, almost nothing

    One effect of **La Régie**'s `fx` pack, travelling alone: a script built out of Home Assistant's own light and scene services. No helper, no custom code, nothing else to install.

    Create the script from this blueprint, then call it with the lights you want it on: it snapshots them, runs, and puts the snapshot back as it was.

    Fields: `target` · `colour` · `level` · `restore`.
  domain: script
  homeassistant:
    min_version: 2024.8.0
  input: {}
alias: fx — drain
description: 'the colour bleeds out — amber, blood, almost nothing (La Régie, pack fx: a shape compiled for the ha backend)'
icon: mdi:water-opacity
mode: parallel
max: 10
fields:
  target:
    name: target
    description: 'the light or the group (a room''s role: light.<room>_<role>)'
    required: true
    selector:
      entity:
        domain: light
        multiple: true
  colour:
    name: colour
    description: '#rrggbb — the target''s own colour when empty'
    selector:
      text: null
    default: '#3a0002'
  level:
    name: level
    selector:
      number:
        min: 0
        max: 100
        step: 0.01
        mode: box
    default: 10
  restore:
    name: restore
    description: put the target back as it was, after
    default: false
    selector:
      boolean: null
variables:
  colour: '{{ colour | default(''#3a0002'') }}'
  level: '{{ level | default(10) }}'
  snapshot: fx_{{ this.entity_id[7:] }}_{{ now().strftime('%Y%m%d%H%M%S%f') }}
  colour_rgb: '{{ [colour[1:3] | int(base=16), colour[3:5] | int(base=16), colour[5:7] | int(base=16)] if colour else none }}'
  restore: '{{ restore | default(False) }}'
sequence:
- action: scene.create
  data:
    scene_id: '{{ snapshot }}'
    snapshot_entities: '{{ target }}'
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{{ dict({''brightness_pct'': 70, ''transition'': 8}, rgb_color=[255, 140, 42]) }}'
- delay: 9.0
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{{ dict({''brightness_pct'': 42, ''transition'': 12}, rgb_color=[196, 26, 18]) }}'
- delay: 13.0
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{{ dict({''brightness_pct'': 22, ''transition'': 12}, rgb_color=[122, 2, 6]) }}'
- delay: 13.0
- action: light.turn_on
  target:
    entity_id: '{{ target }}'
  data: '{% set d = {''brightness_pct'': level, ''transition'': 14} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
- delay: 15.0
- if:
  - condition: template
    value_template: '{{ restore }}'
  then:
  - action: scene.turn_on
    target:
      entity_id: scene.{{ snapshot }}
- action: scene.delete
  target:
    entity_id: scene.{{ snapshot }}
