# fx_heartbeat — rendered by La Régie: `regie share <home.yml> fx heartbeat`.
# The shape itself is packs/fx/shapes/heartbeat.yml in github.com/tomblancdev/regie;
# a tag whose blueprints differ from what its shapes render is refused by CI.
blueprint:
  name: fx — heartbeat
  description: |-
    a heart that speeds up — slow, faster, running, gone

    One effect of **La Régie**'s `fx` pack, travelling alone: a script built out of Home Assistant's own light and scene services. No helper, no custom code, nothing else to install.

    Create the script from this blueprint, then call it with the lights you want it on: it snapshots them, runs, and puts the snapshot back as it was.

    Fields: `target` · `colour` · `level` · `restore`.
  domain: script
  homeassistant:
    min_version: 2024.8.0
  input: {}
alias: fx — heartbeat
description: 'a heart that speeds up — slow, faster, running, gone (La Régie, pack fx: a shape compiled for the ha backend)'
icon: mdi:heart-flash
mode: parallel
max: 10
fields:
  target:
    name: target
    description: 'the light or the group (a room''s role: light.<room>_<role>)'
    required: true
    selector:
      entity:
        domain: light
        multiple: true
  colour:
    name: colour
    description: '#rrggbb — the target''s own colour when empty'
    selector:
      text: null
    default: '#8c0f14'
  level:
    name: level
    selector:
      number:
        min: 0
        max: 100
        step: 0.01
        mode: box
    default: 70
  restore:
    name: restore
    description: put the target back as it was, after
    default: true
    selector:
      boolean: null
variables:
  colour: '{{ colour | default(''#8c0f14'') }}'
  level: '{{ level | default(70) }}'
  snapshot: fx_{{ this.entity_id[7:] }}_{{ now().strftime('%Y%m%d%H%M%S%f') }}
  colour_rgb: '{{ [colour[1:3] | int(base=16), colour[3:5] | int(base=16), colour[5:7] | int(base=16)] if colour else none }}'
  restore: '{{ restore | default(True) }}'
sequence:
- action: scene.create
  data:
    scene_id: '{{ snapshot }}'
    snapshot_entities: '{{ target }}'
- repeat:
    count: 4
    sequence:
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{% set d = {''brightness_pct'': level, ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
    - delay: 0.12
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{{ {''brightness_pct'': 0, ''transition'': 0} }}'
    - delay: 0.1
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{% set d = {''brightness_pct'': (range(24, 39) | random), ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
    - delay: 0.1
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{{ {''brightness_pct'': 0, ''transition'': 0} }}'
    - delay: '{{ [((range(1100, 1501) | random) / 1000), 0.05] | max }}'
- repeat:
    count: 5
    sequence:
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{% set d = {''brightness_pct'': level, ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
    - delay: 0.12
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{{ {''brightness_pct'': 0, ''transition'': 0} }}'
    - delay: 0.1
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{% set d = {''brightness_pct'': (range(26, 41) | random), ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
    - delay: 0.1
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{{ {''brightness_pct'': 0, ''transition'': 0} }}'
    - delay: '{{ [((range(600, 851) | random) / 1000), 0.05] | max }}'
- repeat:
    count: 7
    sequence:
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{% set d = {''brightness_pct'': level, ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
    - delay: 0.12
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{{ {''brightness_pct'': 0, ''transition'': 0} }}'
    - delay: 0.1
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{% set d = {''brightness_pct'': (range(30, 47) | random), ''transition'': 0} %}{% if colour_rgb %}{% set d = dict(d, rgb_color=colour_rgb) %}{% endif %}{{ d }}'
    - delay: 0.1
    - action: light.turn_on
      target:
        entity_id: '{{ target }}'
      data: '{{ {''brightness_pct'': 0, ''transition'': 0} }}'
    - delay: '{{ [((range(280, 451) | random) / 1000), 0.05] | max }}'
- if:
  - condition: template
    value_template: '{{ restore }}'
  then:
  - action: scene.turn_on
    target:
      entity_id: scene.{{ snapshot }}
- action: scene.delete
  target:
    entity_id: scene.{{ snapshot }}
