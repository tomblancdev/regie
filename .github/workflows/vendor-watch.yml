name: vendor-watch
# The card the plan is drawn with is CARRIED by the product (base/www/VENDOR.md),
# never fetched by a brain. This is how it stays fresh without a store: once a
# week, upstream's latest release is compared with the vendored file, and a new
# one arrives as a pull request - the file, the checksum, the version in the
# URL. The PR is the notification; merging it is the read; the release is a
# person's, as every bump in a house is.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: watch
        run: |
          out=$(sh tools/vendor-watch.sh --fetch)
          echo "$out"
          echo "result=$out" >> "$GITHUB_OUTPUT"
      - if: startsWith(steps.watch.outputs.result, 'new ')
        uses: peter-evans/create-pull-request@v7
        with:
          branch: vendor/easy-floorplan
          title: "vendor: easy-floorplan ${{ steps.watch.outputs.result }}"
          commit-message: "vendor: easy-floorplan ${{ steps.watch.outputs.result }}"
          body: |
            Upstream released a new easy-floorplan. This PR carries the release asset, its sha256 in `base/www/VENDOR.md` and the version in the card's URL (`floorplan.py`).

            Before merging: read upstream's release notes for a change in the card's config, run the plan tests, and add the changelog line. A merge is a read; the release and the pin are a person's.
