name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  # This repo is a product anyone can run. Whoever runs it keeps their own
  # addresses, hostnames, domains, room names and house word in their own
  # configuration; the only thing crossing between them is a pinned tag. A
  # convention nobody can forget beats one everybody means to keep.
  no-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/no-environment.sh

  # the engine: lint, the tests (the packs' own included), then the witness
  # house checked and rendered — the documentation and the smoke test at once
  engine:
    needs: [no-environment]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]   # a Raspberry Pi on bookworm, a Debian 13 container
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install --quiet -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: regie check examples/maison-temoin/home.yml --secrets examples/maison-temoin/secrets.example.yml
      - run: regie render examples/maison-temoin/home.yml --secrets examples/maison-temoin/secrets.example.yml --out /tmp/brain
      - run: find /tmp/brain -type f | sort
      # the WHEEL, not the checkout: a host installs the package (a venv, pip
      # from the tag) - every data file the engine reads must ship in it
      # (base.yml did not, once: found at the first converge, 2026-08-29)
      - run: python -m venv /tmp/wheel && /tmp/wheel/bin/pip install --quiet .
      - run: cd /tmp && /tmp/wheel/bin/regie render $GITHUB_WORKSPACE/examples/maison-temoin/home.yml --secrets $GITHUB_WORKSPACE/examples/maison-temoin/secrets.example.yml --out /tmp/brain-wheel && /tmp/wheel/bin/regie up $GITHUB_WORKSPACE/examples/maison-temoin/home.yml --root /tmp/brain-wheel --units-dir /tmp/units-wheel --check

  collection:
    needs: [no-environment]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install --quiet ansible-core
      - run: ansible-galaxy collection build ansible/ --output-path /tmp/collection
      - run: ansible-galaxy collection install /tmp/collection/tomblancdev-regie-*.tar.gz -p /tmp/collections
      - run: ANSIBLE_COLLECTIONS_PATH=/tmp/collections ansible-galaxy collection list tomblancdev.regie

  image:
    needs: [no-environment, engine]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
