---
# engine — the CLI on the brain's host, from the product's tag — or, for a
# dev loop, from a checkout on the controller (regie_source)
- name: engine — the host's packages
  ansible.builtin.apt:
    name: "{{ regie_engine_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: engine — the venv
  ansible.builtin.command:
    cmd: python3 -m venv {{ regie_venv }}
    creates: "{{ regie_venv }}/bin/pip"

# The dev loop (0.29): a checkout on the controller, packed into one
# reproducible archive (files/source-archive.sh) whose version carries a
# `+local.<digest>` label, copied to the host and installed from there. The
# ref it is keyed on is `local:<digest>`: an edit in the working copy is a
# new install, an unchanged copy changes nothing, and the next converge
# without regie_source sees a ref that is not the tag and puts the tag back.
- name: engine — the checkout, packed (a dev loop)
  ansible.builtin.script:
    cmd: source-archive.sh {{ regie_source }} {{ regie_source_archive }}
  delegate_to: localhost
  become: false
  register: regie_engine_pack
  changed_when: false
  when: regie_source | length > 0

- name: engine — the ref wanted
  ansible.builtin.set_fact:
    regie_engine_want: "{{ ('local:' ~ (regie_engine_pack.stdout | trim)) if regie_source | length > 0 else regie_version }}"
    regie_engine_from: "{{ (regie_venv ~ '/source.tgz') if regie_source | length > 0 else ('git+' ~ regie_repo ~ '@' ~ regie_version) }}"

- name: engine — the checkout, on the host
  ansible.builtin.copy:
    src: "{{ regie_source_archive }}"
    dest: "{{ regie_venv }}/source.tgz"
    mode: "0644"
  when: regie_source | length > 0

- name: engine — the checkout, gone (the tag path leaves no trace of a dev loop)
  ansible.builtin.file:
    path: "{{ regie_venv }}/source.tgz"
    state: absent
  when: regie_source | length == 0

# keyed on the REF, not the version: a moved ref (a sha, a re-cut tag) with
# the same version number is a different package - ansible's pip module
# compares 0.2.0 to 0.2.0 and leaves the old one in place, and pip itself
# answers "already satisfied" to a VCS URL at a new commit unless forced
# (both found at the first converge, 2026-08-29: direct_url.json kept the
# old commit). So: force-reinstall, exactly when the marker differs.
- name: engine — the ref installed last time
  ansible.builtin.slurp:
    src: "{{ regie_venv }}/.ref"
  register: regie_engine_ref
  failed_when: false

- name: engine — the package, from the ref
  ansible.builtin.command:
    cmd: "{{ regie_venv }}/bin/pip install --quiet --upgrade --force-reinstall {{ regie_engine_from }}"
  when: (regie_engine_ref.content | default('') | b64decode | trim) != regie_engine_want
  register: regie_engine_install

- name: engine — the ref, remembered
  ansible.builtin.copy:
    content: "{{ regie_engine_want }}\n"
    dest: "{{ regie_venv }}/.ref"
    mode: "0644"

- name: engine — on the PATH
  ansible.builtin.file:
    src: "{{ regie_venv }}/bin/regie"
    dest: "{{ regie_bin }}"
    state: link

- name: engine — the version it answers
  ansible.builtin.command:
    cmd: "{{ regie_bin }} --version"
  changed_when: false
  register: regie_engine_version

- name: engine — say it
  ansible.builtin.debug:
    msg: "{{ regie_engine_version.stdout }} ({{ regie_engine_want }})"
